{% extends "base.html" %}

{% block content %}

<style>

    .payment-container {
        width: 400px;
        margin: 50px auto;
        padding: 25px;
        background: white;
        border-radius: 10px;
        box-shadow: 0px 0px 10px lightgray;
        text-align: center;
    }

    .payment-container h2 {
        margin-bottom: 10px;
    }

    .method-box {
        text-align: left;
        margin: 10px 0;
    }

    .pay-btn {
        margin-top: 20px;
        padding: 10px;
        background: green;
        color: white;
        border: none;
        border-radius: 5px;
        width: 100%;
        cursor: pointer;
    }

    .hidden {
        display: none;
    }

    input,
    select {
        width: 90%;
        padding: 8px;
        margin: 5px 0;
    }

    .error {
        color: red;
        font-weight: bold;
        margin-bottom: 10px;
    }

</style>

<script>

    function showFields(method) {

        document.getElementById("upi").style.display = "none";

        document.getElementById("card").style.display = "none";

        document.getElementById("netbanking").style.display = "none";

        document.getElementById(method).style.display = "block";
    }

</script>

<div class="payment-container">

    <h2>Payment Page</h2>

    <p>
        <b>Amount: ₹{{ fee }}</b>
    </p>

    {% if error %}

        <p class="error">

            {{ error }}

        </p>

    {% endif %}

    <form method="POST">

        <!-- UPI -->

        <div class="method-box">

            <input
                type="radio"
                name="payment_method"
                value="UPI"
                onclick="showFields('upi')"
                required
            >

            UPI

        </div>

        <!-- CARD -->

        <div class="method-box">

            <input
                type="radio"
                name="payment_method"
                value="Card"
                onclick="showFields('card')"
            >

            Card

        </div>

        <!-- NET BANKING -->

        <div class="method-box">

            <input
                type="radio"
                name="payment_method"
                value="NetBanking"
                onclick="showFields('netbanking')"
            >

            Net Banking

        </div>

        <!-- UPI BOX -->

        <div id="upi" class="hidden">

            <p>Scan QR to Pay</p>

            <img
                src="{{ url_for('static', filename='qr.png') }}"
                width="200"
            >

            <br><br>

            <input
                type="text"
                name="upi_id"
                placeholder="Enter UPI ID"
            >

        </div>

        <!-- CARD BOX -->

        <div id="card" class="hidden">

            <input
                type="text"
                placeholder="Card Number"
            >

            <input
                type="text"
                placeholder="Expiry Date"
            >

            <input
                type="text"
                placeholder="CVV"
            >

        </div>

        <!-- NET BANKING BOX -->

        <div id="netbanking" class="hidden">

            <select>

                <option>SBI</option>

                <option>HDFC</option>

                <option>ICICI</option>

                <option>Axis Bank</option>

            </select>

        </div>

        <button class="pay-btn" type="submit">

            Pay Now

        </button>

    </form>

</div>

{% endblock %}
