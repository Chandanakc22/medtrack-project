{% extends "base.html" %}

{% block content %}

<h2 style="text-align:center; margin-top:20px;">
    Assigned Staff List
</h2>

<table border="1"
       style="
            width:95%;
            margin:auto;
            text-align:center;
            border-collapse:collapse;
            margin-top:20px;
       ">

    <tr style="background:#007bff; color:white;">

        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Assigned Hospital</th>
        <th>Change Hospital</th>
        <th>Remove</th>

    </tr>

    {% for staff in staff_list %}

    <tr>

        <td>{{ staff.name }}</td>

        <td>{{ staff.email }}</td>

        <td>{{ staff.phone }}</td>

        <td>
            {{ staff.hospital.hospital_name }}
        </td>

        <td>

            <form action="/change_hospital/{{ staff.id }}"
                  method="POST">

                <select name="hospital_id">

                    {% for hospital in hospitals %}

                    <option value="{{ hospital.id }}">

                        {{ hospital.hospital_name }}

                    </option>

                    {% endfor %}

                </select>

                <button type="submit">
                    Change
                </button>

            </form>

        </td>

        <td>

            <a href="/remove_staff/{{ staff.id }}"
               style="
                    background:red;
                    color:white;
                    padding:5px 10px;
                    text-decoration:none;
                    border-radius:5px;
               ">
                Remove
            </a>

        </td>

    </tr>

    {% endfor %}

</table>

{% endblock %}
