<!DOCTYPE html><html>
<head><title>MedTrack</title><style>

body{
font-family: Arial;
background: linear-gradient(to right,#3498db,#2ecc71);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:white;
padding:40px;
border-radius:10px;
text-align:center;
width:350px;
box-shadow:0px 5px 20px rgba(0,0,0,0.2);
}

h1{
color:#2c3e50;
}

input[type="text"], 
input[type="email"], 
input[type="password"]{
width:90%;
padding:10px;
margin:10px;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:95%;
padding:10px;
background:#3498db;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#2980b9;
}

a{
text-decoration:none;
color:#3498db;
}

.show-password{
display:flex;
justify-content:center;
align-items:center;
gap:6px;
margin-top:5px;
}

</style>
</head>
<body>
    <div class="box">
    <h1>MedTrack</h1>
    <p>Emergency Hospital Bed Tracking System</p>
    <form method="POST" action="/login">
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    <input type="email" name="email" placeholder="Email" required>
    <br>
    <input type="password" id="password" name="password" placeholder="Password" required>
    <br>
    <label style = "display:inline-block;">
        <input type="checkbox" onclick="showPassword()"> Show Password
    </label>

     <br>
    
    
    <button type="submit">Login</button>

</form>
<br><br>

<a href="/forgot_password">Forgot Password?</a>

&nbsp;&nbsp;  | &nbsp;&nbsp;
<a href="/register">New User? Register here</a> 
</div>
</body>

<script>
function showPassword() {
    var x = document.getElementById("password");

    if (x.type === "password") {
        x.type = "text";
    } else {
        x.type = "password";
    }
}
</script>
</html>
