<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
        }

        .error {
            color: red;
        }

        a {
            text-decoration: none;
            color: blue;
            font-size: 14px;
        }

        /* PASSWORD BOX FIXED */
        .password-box {
            position: relative;
        }

        .password-box input {
            width: 100%;
            padding: 10px;
            padding-right: 40px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        .toggle-eye {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .forgot {
            text-align: right;
            margin-top: -5px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>{{ role.capitalize() }} Login</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <input type="hidden" name="role" value="{{ role }}">

        <input type="email" name="email" placeholder="Enter Email" required>

        <!-- PASSWORD -->
        <div class="password-box">
            <input type="password" id="password" name="password" placeholder="Enter Password" required>

            <span class="toggle-eye" onclick="togglePassword()">

                <!-- OPEN EYE -->
                <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="black" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>

                <!-- CLOSED EYE -->
                <svg id="eyeClose" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="black" stroke-width="2" viewBox="0 0 24 24" style="display:none;">
                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.77 21.77 0 0 1 5.06-5.94"/>
                    <path d="M1 1l22 22"/>
                    <path d="M9.53 9.53a3 3 0 0 0 4.24 4.24"/>
                    <path d="M14.47 14.47A3 3 0 0 1 9.53 9.53"/>
                    <path d="M10.73 5.08A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a21.77 21.77 0 0 1-3.06 4.57"/>
                </svg>

            </span>
        </div>

        <!-- FORGOT PASSWORD -->
        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">Login</button>

    </form>

    <br>

    {% if role != "admin" %}
        <p>
            New user? <a href="/register?role={{ role }}">Register</a>
        </p>
    {% endif %}

</div>

<script>
function togglePassword() {
    const input = document.getElementById("password");
    const openEye = document.getElementById("eyeOpen");
    const closeEye = document.getElementById("eyeClose");

    if (input.type === "password") {
        input.type = "text";
        openEye.style.display = "none";
        closeEye.style.display = "inline";
    } else {
        input.type = "password";
        openEye.style.display = "inline";
        closeEye.style.display = "none";
    }
}
</script>

</body>
</html>
