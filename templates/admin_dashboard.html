<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
            margin: 0;
        }

        .header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            padding: 20px;
            text-align: center;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .card {
            padding: 20px;
            width: 200px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
        }

        .total { background-color: #007bff; }
        .pending { background-color: orange; }
        .confirmed { background-color: green; }
        .cancelled { background-color: red; }

        .menu {
            margin-top: 40px;
        }

        .menu a {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            text-decoration: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
        }

        .menu a:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Admin Dashboard</h1>
        <p>Manage Hospital Bed Booking System</p>
    </div>

    <div class="container">

        <!-- STATS CARDS -->
        <div class="cards">

            <div class="card total">
                <h3>Total Bookings</h3>
                <h2>{{ total }}</h2>
            </div>

            <div class="card pending">
                <h3>Pending</h3>
                <h2>{{ pending }}</h2>
            </div>

            <div class="card confirmed">
                <h3>Confirmed</h3>
                <h2>{{ confirmed }}</h2>
            </div>

            <div class="card cancelled">
                <h3>Cancelled</h3>
                <h2>{{ cancelled }}</h2>
            </div>

            <div class = "card" style = "background-color:purple;">
                <h3>Discharged</h3>
                <h2>{{ discharged }}</h2>
            </div>

        </div>

        <!-- MENU -->
        <div class="menu">
            <a href="/hospitals">View Hospitals</a>
            <a href="/view_bookings">View Bookings</a>
            <a href="/logout">Logout</a>
        </div>

    </div>

</body>
</html>
