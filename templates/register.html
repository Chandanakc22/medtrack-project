<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .register-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 320px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            cursor: pointer;
            border-radius: 5px;
        }

        a {
            text-decoration: none;
            color: blue;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 45px;
        }

        .toggle-eye {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .toggle-eye svg {
            width: 20px;
            height: 20px;
        }

    </style>
</head>

<body>

<div class="register-box">

    <h2>{{ role.capitalize() }} Register</h2>

    {% if error %}
        <p style="
            color:red;
            text-align:center;
            font-weight:bold;
            margin-bottom:15px;
        ">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST">

        <input type="hidden" name="role" value="{{ role }}">

        <input type="text" name="name" placeholder="Enter Name" required>

        <input type="email" name="email" placeholder="Enter Email" required>

        <input type="text" name="phone" placeholder="Enter Phone" required>

        <!-- PASSWORD -->

        <div class="password-box">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <span class="toggle-eye" onclick="togglePassword()">

                <!-- EYE CLOSED -->

                <svg id="eyeClose"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M3 3l18 18"/>

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M10.584 10.587a2 2 0 102.828 2.829"/>

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M9.88 5.09A9.953 9.953 0 0112 4.5c5 0 9 7.5 9 7.5a17.44 17.44 0 01-2.223 3.592M6.228 6.228A17.48 17.48 0 003 12s4 7.5 9 7.5a9.95 9.95 0 005.272-1.5"/>

                </svg>

                <!-- EYE OPEN -->

                <svg id="eyeOpen"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="2"
                    stroke="currentColor"
                    style="display:none;">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>

                    <circle cx="12" cy="12" r="3"/>

                </svg>

            </span>

        </div>

        <button type="submit">
            Register
        </button>

    </form>

    <br>

    <p>
        Already registered?
        <a href="/login?role={{ role }}">
            Login
        </a>
    </p>

</div>

<script>

function togglePassword() {

    const input = document.getElementById("password");

    const eyeOpen = document.getElementById("eyeOpen");

    const eyeClose = document.getElementById("eyeClose");

    if (input.type === "password") {

        input.type = "text";

        eyeOpen.style.display = "block";

        eyeClose.style.display = "none";

    } else {

        input.type = "password";

        eyeOpen.style.display = "none";

        eyeClose.style.display = "block";
    }
}

</script>

</body>
</html>
