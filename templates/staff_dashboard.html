<!DOCTYPE html>
<html>

<head>
    <title>Staff Dashboard</title>

    <style>

        body{
            font-family: Arial;
            background: #f4f6f7;
            margin:0;
            text-align:center;
        }

        .header{
            background:#16a085;
            color:white;
            padding:25px;
        }

        .header h1{
            margin:0;
        }

        .header p{
            margin-top:10px;
            font-size:18px;
        }

        .notification{
            width:80%;
            margin:20px auto;
            background:#d4edda;
            color:#155724;
            padding:15px;
            border-radius:8px;
            font-weight:bold;
        }

        .container{
            margin-top:40px;
        }

        .card{
            display:inline-block;
            background:white;
            padding:25px;
            margin:15px;
            width:220px;
            border-radius:10px;
            box-shadow:0px 4px 10px rgba(0,0,0,0.1);
            transition:0.3s;
        }

        .card:hover{
            background:#ecf0f1;
            transform:scale(1.03);
        }

        .card a{
            text-decoration:none;
            font-size:18px;
            color:#2c3e50;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="header">
        <h1>Staff Dashboard</h1>
        <p>Manage Hospital Beds</p>
    </div>

   

    <div class="container">
        <h3>
            Assigned Hospital:{{hospital.hospital_name}}
        </h3>
    
        <div class="card">
            <a href="/view_bookings">View Bookings</a>
        </div>

        <div class="card">
            <a href="/logout">Logout</a>
        </div>

    </div>

</body>

</html>
